name: APK derle

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Python robotunu uygulamaya kopyala
        run: |
          rm -rf android/app/src/main/python/robot
          mkdir -p android/app/src/main/python/robot android/app/src/main/assets
          cp robot/*.py android/app/src/main/python/robot/
          cp robot/panel.html android/app/src/main/assets/panel.html

      - name: Python testleri (masaüstü)
        run: |
          python testler/test_veri.py
          python testler/test_motor.py

      - name: APK derle
        run: |
          mkdir -p test_sonuc
          set -o pipefail
          gradle -p android assembleRelease --stacktrace --no-daemon 2>&1 | tee test_sonuc/gradle.log
          cp android/app/build/outputs/apk/release/app-release.apk BIST-Konsey-Robotu.apk
          ls -la BIST-Konsey-Robotu.apk | tee -a test_sonuc/ozet.txt

      - name: KVM etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde duman testi
        id: duman
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/duman_testi.sh BIST-Konsey-Robotu.apk

      - name: Çıktıları 'cikti' dalına yaz
        if: always()
        run: |
          mkdir -p /tmp/cikti
          cp -r test_sonuc /tmp/cikti/ 2>/dev/null || true
          cp BIST-Konsey-Robotu.apk /tmp/cikti/ 2>/dev/null || true
          echo "calisma=${{ github.run_number }} commit=${{ github.sha }} duman=${{ steps.duman.outcome }}" > /tmp/cikti/BILGI.txt
          cd /tmp/cikti
          git init -q -b cikti
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "APK ve test sonuçları #${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cikti

      - name: Sürüm yayınla (telefondan indirmek için)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BIST Konsey Robotu 1.0.${{ github.run_number }}
          body: "Telefonunuzda bu sayfayı açın ve BIST-Konsey-Robotu.apk dosyasını indirip kurun. Duman testi: ${{ steps.duman.outcome }}"
          files: BIST-Konsey-Robotu.apk
